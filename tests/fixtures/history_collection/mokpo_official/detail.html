<!doctype html><html><head><title>목포 개항과 도시계획</title><link rel="canonical" href="https://www.mokpo.go.kr/www/open_administration/city_history/view/?idx=101"></head><body><nav>목포시 메뉴 통합검색</nav><article><h1>목포 개항과 도시계획</h1><p>목포는 개항 이후 항만과 도로, 상수도 등 도시 기반시설을 확충하며 식민지기 도시 공간이 변화하였다.</p><p>광복 이후에도 근대 시설의 용도와 도시 행정구역은 계속 변화하였다.</p></article><div class="copyright">이 문서의 공공누리 유형은 문서별 확인이 필요합니다.</div><footer>담당부서</footer></body></html>
